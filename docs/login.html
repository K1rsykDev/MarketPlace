{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Вхід</h2>
  <form method="post">
    <div class="field">
      <label>Логін</label>
      <input type="text" name="username" required />
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" name="password" required />
    </div>
    <button class="btn btn-success" type="submit">Увійти</button>
  </form>
</div>
{% endblock %}
